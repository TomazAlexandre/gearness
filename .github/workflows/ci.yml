name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 18 is the minimum in package.json engines; 22 and 24 are the current LTS lines.
        node: [18, 22, 24]
        include:
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Dogfooding: gearness gates its own harness.
      - run: node dist/cli.js lint --format github
      - run: node dist/cli.js doctor --ci
      - name: Harness report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 24
        shell: bash
        run: node dist/cli.js doctor --markdown >> "$GITHUB_STEP_SUMMARY"
